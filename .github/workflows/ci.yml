name: AKE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            runtime/requirements.txt
            runtime/ake_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ake_server/requirements.txt pytest httpx

      - name: Compile
        run: python -m compileall -q .

      - name: Test suite
        run: pytest -q

      - name: Regression suite
        run: python tests/regression.py

      - name: Acceptance suite
        run: python tests/acceptance_suite.py
